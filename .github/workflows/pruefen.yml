# Prüfen ohne Veröffentlichung: kompiliert Android (Debug-APK nur im Lauf, nicht hochgeladen), die Web-Fassung und
# führt die Tests des gemeinsamen Codes aus. Läuft nur von Hand (Actions → Prüfen → Run workflow). Veröffentlicht nichts;
# es legt nur zwei Bibliotheken für Testläufe ohne Google-Zugang auf dem Branch testbibliotheken ab.
name: Prüfen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Android kompilieren
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Tests
        run: ./gradlew --no-daemon :desktop:test

      # Protokoll der Oberflächen-Rundgänge ins Log, auch wenn ein Test hängt oder scheitert (seit 4.8)
      - name: Rundgang-Protokoll
        if: always()
        run: |
          for f in desktop/build/testbilder/*.txt; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done
          true

      # Für Testläufe ohne Zugang zu Googles Maven-Server (seit 4.6): androidx.collection und androidx.annotation auf dem
      # Branch testbibliotheken (nur diese Dateien, jedes Mal ersetzt), wie die APK auf dem Branch apk
      - name: Bibliotheken für Tests ohne Google-Zugang
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bibliotheken
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          for g in androidx.collection androidx.annotation; do
            [ -d "$cache/$g" ] && find "$cache/$g" -name '*-jvm-*.jar' ! -name '*-sources.jar' -exec cp {} bibliotheken/ \;
          done
          ls -la bibliotheken
          [ -n "$(ls bibliotheken)" ] || exit 0
          cd bibliotheken
          git init -q -b testbibliotheken
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "androidx-Bibliotheken für Tests"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" testbibliotheken
