# Bildschirmfotos der Android-App fuer die Kurzanleitung (seit 4.9). Startet die App im Emulator mit einem
# Beispieldepot, fotografiert die wichtigsten Seiten auf Deutsch und Englisch und legt die Fotos verkleinert (WebP)
# in den Branch „anleitungsbilder“ und als Artefakt ab. Von dort kommen sie nach Pruefung in
# app/src/main/assets/anleitung. Laeuft nur von Hand.
name: Anleitungsbilder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Platz schaffen
        run: |
          # Der Emulator legt eine Datenpartition von mehreren GB an; das Abbild hat dafuer zu wenig frei
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: App und Fotolauf bauen
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: KVM und Bibliotheken fuer den Emulator
        run: |
          # Der Emulator braucht libpulse, die dem Abbild fehlt
          sudo apt-get update -q
          sudo apt-get install -y -q libpulse0 libgl1 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libasound2t64
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fotos im Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect
          script: bash .github/anleitung/aufnehmen.sh

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verkleinern
        run: |
          pip install --quiet pillow
          python3 .github/anleitung/verkleinern.py roh anleitung

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anleitungsbilder
          path: |
            anleitung
            roh/protokoll-*.txt
          if-no-files-found: warn

      - name: Branch anleitungsbilder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp roh/protokoll-*.txt anleitung/ 2>/dev/null || true
          cd anleitung
          git init -q -b anleitungsbilder
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Anleitungsbilder vom Stand ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" anleitungsbilder
