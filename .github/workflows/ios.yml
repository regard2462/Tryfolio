# iPhone- und iPad-App von Tryfolio als unsignierte IPA (seit 5.92).
# Läuft bei jedem Versions-Tag (v5.92 usw.) und von Hand. Baut auf einem Mac von GitHub das Kotlin-Framework aus dem
# eigenen Gradle-Build in ios/, dann die Xcode-Hülle iosApp/ ohne Signatur, und packt Payload/Tryfolio.app zu
# Tryfolio-<Fassung>-ios-unsigned.ipa. Die IPA liegt als Artefakt am Lauf und kommt an das Release v<Fassung>, wenn
# es das schon gibt. Signiert wird beim Installieren: SideStore, AltStore oder Sideloadly mit der eigenen Apple-ID.
#
# WICHTIG: Der Lauf greift erst, wenn das Repository öffentlich ist. Nur öffentliche Repositories bekommen die
# macOS-Rechner von GitHub ohne Minutenverbrauch; im privaten Zustand würden die Minuten des Kontos gezählt (für
# dieses Konto gibt es keine freien mehr). Solange das Repository privat ist, endet der Job darum sofort, ohne einen
# Mac zu starten. Für den privaten Zustand gibt es denselben Ablauf in codemagic.yaml.
name: iOS-IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    # Nur im öffentlichen Repository (siehe oben)
    if: ${{ !github.event.repository.private }}
    # Intel-Mac mit 14 GB statt Apple-Silicon mit 7 GB: das Linken des Release-Frameworks braucht viel Speicher
    runs-on: macos-15-intel
    # Das Linken des Release-Frameworks allein braucht seit 0.79 ueber 80 Minuten; oeffentliche Repositories duerfen 6 Stunden
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Fassung und Xcode
        run: |
          fassung=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "FASSUNG=$fassung" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Kotlin-Framework bauen
        run: |
          chmod +x gradlew
          ./gradlew -p ios linkReleaseFrameworkIosArm64 --no-daemon

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build-ios" MARKETING_VERSION="$FASSUNG" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          app="build-ios/Release-iphoneos/Tryfolio.app"
          test -d "$app" || { echo "Tryfolio.app fehlt"; exit 1; }
          mkdir -p ausgabe paket/Payload
          cp -R "$app" paket/Payload/
          (cd paket && zip -qry "../ausgabe/Tryfolio-$FASSUNG-ios-unsigned.ipa" Payload)
          ls -l ausgabe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ipa
          path: ausgabe/*.ipa
          if-no-files-found: error

      - name: An das Release der Fassung hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$FASSUNG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Kein Release $tag, die IPA liegt nur als Artefakt am Lauf"
            exit 0
          fi
          gh release upload "$tag" "ausgabe/Tryfolio-$FASSUNG-ios-unsigned.ipa" --clobber
