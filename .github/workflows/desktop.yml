# Windows-, Linux- und Mac-Pakete von Tryfolio.
# Läuft bei jedem Versions-Tag (v2.5 usw.) und von Hand. Baut auf echten Windows-, Linux- und Mac-Rechnern,
# prüft dort die Tests, das fertige Paket per Selbsttest (ohne Fenster) und hängt die Dateien an das Release.
# Von Hand mit „veröffentlichen“ legt der Lauf das Release v<versionName> selbst an (Text aus .github/release-text.md),
# falls es noch fehlt; ohne den Haken entstehen die Pakete nur als Artefakte am Lauf.
name: Desktop-Pakete

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Release v<Fassung> anlegen (falls es fehlt) und die Pakete anhängen"
        type: boolean
        default: false
      systeme:
        description: "Welche Systeme (Komma-getrennt: windows, linux, mac)"
        type: string
        default: "windows,linux,mac"
      tests:
        description: "Nur diese Tests (Gradle --tests, leer = alle)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  freigabe:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.f.outputs.tag }}
      veroeffentlichen: ${{ steps.f.outputs.veroeffentlichen }}
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fassung und Release
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fassung=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          version=$(sed -n 's/^val troeteVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"; aus=true
          elif [ "${{ inputs.veroeffentlichen }}" = true ]; then
            tag="v$fassung"; aus=true
          else
            tag=""; aus=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "veroeffentlichen=$aus" >> "$GITHUB_OUTPUT"
          # Nur die gewählten Systeme bauen (beim Tag alle)
          wahl="${{ inputs.systeme }}"
          [ -n "$wahl" ] || wahl="windows,linux,mac"
          matrix=$(python3 -c 'import json,sys; alle=[{"os":"windows-2022","name":"windows"},{"os":"ubuntu-22.04","name":"linux"},{"os":"macos-15","name":"mac"}]; w=[s.strip() for s in sys.argv[1].split(",")]; print(json.dumps({"include":[a for a in alle if a["name"] in w]}))' "$wahl")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          [ "$aus" = true ] || exit 0
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sed "s/@FASSUNG@/$fassung/g; s/@VERSION@/$version/g" .github/release-text.md > "$RUNNER_TEMP/text.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tryfolio $fassung" --notes-file "$RUNNER_TEMP/text.md"
          fi

  pakete:
    needs: freigabe
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.freigabe.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Fassung
        run: |
          v=$(sed -n 's/^val troeteVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p ausgabe

      - name: Tests (gemeinsamer Code und Desktop-Oberfläche ohne Fenster)
        env:
          NUR: ${{ inputs.tests }}
        run: |
          # Windows ohne die Oberflächen-Rundgänge: GitHubs Windows-Rechner zeichnen ohne Grafikkarte so langsam, dass ein
          # Rundgang dort über 40 Minuten braucht. Sie laufen hier auf Linux und Mac und in jedem Prüflauf.
          extra=""
          [ "${{ matrix.name }}" = windows ] && extra="-Ptroete.ohneRundgang"
          if [ -n "$NUR" ]; then ./gradlew --no-daemon :desktop:test $extra --tests "$NUR"; else ./gradlew --no-daemon :desktop:test $extra; fi

      - name: Ablaufprotokolle der Oberflächentests
        if: failure()
        run: for f in desktop/build/testbilder/*.txt; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true

      - name: Windows-Installer und portable Fassung
        if: matrix.name == 'windows'
        run: |
          ./gradlew --no-daemon :desktop:packageMsi :desktop:createDistributable
          cp desktop/build/compose/binaries/main/msi/*.msi "ausgabe/Tryfolio-$VERSION-windows-x64.msi"
          (cd desktop/build/compose/binaries/main/app && 7z a -tzip "$GITHUB_WORKSPACE/ausgabe/Tryfolio-$VERSION-windows-x64-portabel.zip" Tryfolio >/dev/null)

      - name: Linux-Pakete
        if: matrix.name == 'linux'
        run: |
          sudo apt-get install -y fakeroot >/dev/null
          ./gradlew --no-daemon :desktop:packageDeb :desktop:createDistributable
          cp desktop/build/compose/binaries/main/deb/*.deb "ausgabe/tryfolio_${VERSION}_amd64.deb"
          tar -C desktop/build/compose/binaries/main/app -czf "ausgabe/tryfolio-$VERSION-linux-x64.tar.gz" Tryfolio

      - name: Mac-Programm zum Entpacken (Apple Silicon)
        if: matrix.name == 'mac'
        run: |
          ./gradlew --no-daemon :desktop:createDistributable
          ditto -c -k --keepParent desktop/build/compose/binaries/main/app/Tryfolio.app "ausgabe/Tryfolio-$VERSION-mac-arm64.zip"

      - name: Selbsttest des fertigen Pakets
        run: |
          set +e
          if [ "${{ matrix.name }}" = windows ]; then
            # Windows-Pfad fuer das Programm (Git Bash kennt ihn ueber pwd -W)
            ziel="$(pwd -W)/selbsttest.txt"
            pwsh -Command "\$p = Start-Process -Wait -PassThru -FilePath 'desktop/build/compose/binaries/main/app/Tryfolio/Tryfolio.exe' -ArgumentList '--selbsttest','$ziel'; exit \$p.ExitCode"
          elif [ "${{ matrix.name }}" = mac ]; then
            desktop/build/compose/binaries/main/app/Tryfolio.app/Contents/MacOS/Tryfolio --selbsttest "$PWD/selbsttest.txt"
          else
            desktop/build/compose/binaries/main/app/Tryfolio/bin/Tryfolio --selbsttest "$PWD/selbsttest.txt"
          fi
          code=$?
          cat selbsttest.txt
          exit $code

      - name: Prüfsummen
        run: |
          # macOS kennt sha256sum nicht, nur shasum
          if command -v sha256sum >/dev/null; then summe="sha256sum"; else summe="shasum -a 256"; fi
          (cd ausgabe && $summe * > "SHA256-${{ matrix.name }}.txt" && cat "SHA256-${{ matrix.name }}.txt")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tryfolio-${{ matrix.name }}
          path: |
            ausgabe/*
            selbsttest.txt
            desktop/build/testbilder/*
          if-no-files-found: error

      - name: An das Release hängen
        if: needs.freigabe.outputs.veroeffentlichen == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.freigabe.outputs.tag }}" ausgabe/* --clobber --repo "${{ github.repository }}"
