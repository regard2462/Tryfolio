# Wertpapiergeschäfte des US-Senats als Schnappschuss für die App (assets/copytrading/senat.json).
# Das Senate-eFD-System weist Abrufe von außerhalb der USA ab; dieser Lauf holt die Daten auf einem Rechner von GitHub
# in den USA. Das Ergebnis liegt als Artefakt „senat“ vor und wird vor einer neuen Fassung in die App übernommen.
name: Senat

on:
  workflow_dispatch:
  push:
    paths: ["tools/senat/**", ".github/workflows/senat.yml"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Meldungen holen
        run: python tools/senat/holen.py --jahre 3 --aus senat.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: senat
          path: senat.json
          retention-days: 90
