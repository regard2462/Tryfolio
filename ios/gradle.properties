# Das Linken des Release-Frameworks braucht mehr als 4 GB Heap (Lauf vom 28.10.2026 endete mit Java heap space)
org.gradle.jvmargs=-Xmx10g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.code.style=official
# Klibs fuer iOS lassen sich auch unter Windows und Linux uebersetzen (Pruefung ohne Mac). Linken geht nur auf macOS.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
# Der Wrapper im Hauptordner (Gradle 8.9) gehoert zum Android-Build und bleibt.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
