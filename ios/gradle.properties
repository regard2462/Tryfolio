# Das Linken des Release-Frameworks braucht viel Heap: 10 GB reichten ab 0.79 nicht mehr (GC overhead limit). Der Intel-Mac
# von GitHub hat 14 GB; ohne GC-Overhead-Grenze laeuft das Linken langsam zu Ende, statt abzubrechen.
org.gradle.jvmargs=-Xmx12g -XX:+UseParallelGC -XX:-UseGCOverheadLimit -Dfile.encoding=UTF-8
kotlin.code.style=official
# Klibs fuer iOS lassen sich auch unter Windows und Linux uebersetzen (Pruefung ohne Mac). Linken geht nur auf macOS.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
# Gebaut wird mit dem Wrapper im Hauptordner (Gradle 8.14.6, siehe gradle/wrapper/gradle-wrapper.properties).
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning
